<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>访问受限</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#1f2933;font:16px/1.65 "Microsoft YaHei","PingFang SC",sans-serif}.card{width:min(560px,calc(100% - 32px));padding:36px;border:1px solid #dfe3e8;border-radius:14px;background:#fff;box-shadow:0 18px 50px rgba(31,41,51,.08)}.code{margin:0 0 8px;color:#8a94a0;font-size:13px;letter-spacing:.12em}h1{margin:0 0 16px;font-size:28px}p{margin:0 0 12px}.hint{margin-top:20px;padding-top:18px;border-top:1px solid #edf0f2;color:#52606d;font-size:14px}
</style>
</head>
<body><main class="card"><p class="code">HTTP 403</p><h1>请求已被拒绝</h1><p>服务器无法处理本次请求，请检查请求地址、参数或提交内容后重试。</p><p class="hint">如果你认为这是误判，请联系网站管理员，并提供访问时间和访问地址。</p></main></body>
</html>
