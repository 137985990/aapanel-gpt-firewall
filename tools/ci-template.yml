name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install isolated Lua test runtime
        run: sudo apt-get update && sudo apt-get install -y luajit lua-cjson
      - name: Python and Lua regressions
        run: python tools/check.py
        env:
          FREE_WAF_LUAJIT: /usr/bin/luajit
      - name: Frontend regressions
        run: node --test tests/test_attack_charts.js tests/test_frontend_performance.js
      - name: Build offline package
        run: python tools/build_release.py --output dist/ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aapanel-gpt-firewall-0.1-upgrade
          path: |
            dist/ci/*.zip
            dist/ci/SHA256SUMS
